<!DOCTYPE html>
<html lang="en">

<head>
    <title>Find/Replace</title>
    <link id="theme" rel="stylesheet" type="text/css" href="../../css/light.css">
    <link rel="stylesheet" type="text/css" href="../../css/fonts.css">
</head>

<body class="dialog_body">

    <table class="table_width">
        <tr>
            <td class="middle noWrap"><label for="searchText">Text to Search</label></td>
            <td class="middle fill_width"><input type="text" id="searchText" class="table_input"></td>
        </tr>
        <tr>
            <td class="middle noWrap"><label for="replaceText">Replace with</label></td>
            <td class="middle fill_width"><input type="text" id="replaceText" class="table_input"></td>
        </tr>
    </table>

    <div class="row">
        <input type="checkbox" id="caseSensitive" style="margin-left: 10px;">
        <label for="caseSensitive" class="middleLabel">Case Sensitive</label>
    </div>
    <div class="row">
        <input type="checkbox" id="regularExpression" style="margin-left: 10px;">
        <label for="regularExpression" class="middleLabel">Regular Expression</label>
    </div>

    <div class="buttonArea">
        <button id="find">Find</button>
        <button id="findNext">Find Next</button>
        <button id="replace" disabled>Replace</button>
        <button id="replaceAll">Replace All</button>
    </div>

    <script>
        const { SearchReplace } = require('../../js/searchReplace.js');
        new SearchReplace();
    </script>
</body>

</html>
