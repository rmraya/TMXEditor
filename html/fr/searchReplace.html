<!DOCTYPE html>
<html lang="fr">

<head>
    <title>Rechercher et remplacer</title>
    <link id="theme" rel="stylesheet" type="text/css" href="../../css/light.css">
    <link rel="stylesheet" type="text/css" href="../../css/fonts.css">
    <meta charset="utf-8">
</head>

<body class="dialog_body">

    <table class="table_width">
        <tr>
            <td class="middle noWrap"><label for="searchText">Recherche</label></td>
            <td class="middle fill_width"><input type="text" id="searchText" class="table_input"></td>
        </tr>
        <tr>
            <td class="middle noWrap"><label for="replaceText">Remplacer par</label></td>
            <td class="middle fill_width"><input type="text" id="replaceText" class="table_input"></td>
        </tr>
    </table>

    <div class="row">
        <input type="checkbox" id="caseSensitive" style="margin-left: 10px;">
        <label for="caseSensitive" class="middleLabel">Sensible &agrave; la casse</label>
    </div>
    <div class="row">
        <input type="checkbox" id="regularExpression" style="margin-left: 10px;">
        <label for="regularExpression" class="middleLabel">Expression r&eacute;guli&egrave;re</label>
    </div>

    <div class="buttonArea">
        <button id="find">Rechercher</button>
        <button id="findNext">Rechercher suivant</button>
        <button id="replace" disabled>Remplacer</button>
        <button id="replaceAll">Tout remplacer</button>
    </div>

    <script>
        const { SearchReplace } = require('../../js/searchReplace.js');
        new SearchReplace();
    </script>
</body>

</html>
