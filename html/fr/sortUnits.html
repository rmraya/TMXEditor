<!DOCTYPE html>
<html lang="fr">

<head>
    <title>Trier les unités de traduction</title>
    <link id="theme" rel="stylesheet" type="text/css" href="../../css/light.css">
    <link rel="stylesheet" type="text/css" href="../../css/fonts.css">
<meta charset="utf-8">
</head>

<body class="dialog_body">
    <table class="fill_width">
        <tr>
            <td class="middle noWrap"><label for="sortLanguage">Langue sur laquelle trier</label></td>
            <td class="middle fill_width">
                <select id="sortLanguage" class="table_select">
                </select>
            </td>
        </tr>
    </table>
    <table>
        <tr>
            <td class="middle"><input type="checkbox" id="descending"></td>
            <td class="middle noWrap fill_width"><label for="descending" checked style="margin-top: 2px;">Par ordre décroissant</label></td>
        </tr>
        <tr>
            <td class="middle"><input type="checkbox" id="caseSensitiveSort"></td>
            <td class="middle noWrap fill_width"><label for="caseSensitiveSort" style="margin-top: 2px;">Respecter la casse pour le tri</label></td>
        </tr>
    </table>

    <div class="buttonArea">
        <button id="sort">Trier les unités de traduction</button>
        <button id="clearSort">Annuler le tri</button>
    </div>
    
    <script>
        const { SortUnits } = require('../../js/sortUnits.js');
        new SortUnits();
    </script>
</body>

</html>
