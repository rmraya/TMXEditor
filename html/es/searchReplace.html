<!DOCTYPE html>
<html lang="es">

<head>
    <title>Buscar y Reemplazar</title>
    <link id="theme" rel="stylesheet" type="text/css" href="../../css/light.css">
    <link rel="stylesheet" type="text/css" href="../../css/fonts.css">
</head>

<body class="dialog_body">

    <table class="table_width">
        <tr>
            <td class="middle noWrap"><label for="searchText">Texto a Buscar</label></td>
            <td class="middle fill_width"><input type="text" id="searchText" class="table_input"></td>
        </tr>
        <tr>
            <td class="middle noWrap"><label for="replaceText">Reemplazar con</label></td>
            <td class="middle fill_width"><input type="text" id="replaceText" class="table_input"></td>
        </tr>
    </table>

    <div class="row">
        <input type="checkbox" id="caseSensitive" style="margin-left: 10px;">
        <label for="caseSensitive" class="middleLabel">Distinguir May&uacute;sculas y Min&uacute;sculas</label>
    </div>
    <div class="row">
        <input type="checkbox" id="regularExpression" style="margin-left: 10px;">
        <label for="regularExpression" class="middleLabel">Expresi&oacute;n Regular</label>
    </div>

    <div class="buttonArea">
        <button id="find">Buscar</button>
        <button id="findNext">Buscar Siguiente</button>
        <button id="replace" disabled>Reemplazar</button>
        <button id="replaceAll">Reemplazar Todo</button>
    </div>

    <script>
        const { SearchReplace } = require('../../js/searchReplace.js');
        new SearchReplace();
    </script>
</body>

</html>
